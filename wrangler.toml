# Cloudflare Workers configuration (Workers Static Assets model).
# Vite builds the SPA into dist/; worker/index.js routes /api/* and serves the
# rest from dist/ via the ASSETS binding.
name = "floorcritic"
main = "worker/index.js"
compatibility_date = "2024-11-06"

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the Worker before static-asset matching so it can stamp the COOP/COEP
# headers that ffmpeg.wasm's SharedArrayBuffer requires.
run_worker_first = true
